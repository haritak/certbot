<IfModule mod_ssl.c>
<VirtualHost *:443>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	ServerName certbot.pdekritis.gr
	DocumentRoot /home/haritaksch/certPrintShop

	ServerAdmin webmaster@ych.gr

	ErrorLog ${APACHE_LOG_DIR}/error.certbot.pdekritis.gr.log
	CustomLog ${APACHE_LOG_DIR}/access.certbot.pdekritis.gr.log combined

	<Location /certbot>
		Require all granted
		ProxyPass http://127.0.0.1:12233/certbot
		ProxyPassReverse http://127.0.0.1:12233/certbot
		ProxyPassReverseCookieDomain 127.0.0.1 certbot.pdekritis.gr
		ProxyPreserveHost on
		# make sure Rails knows it was an SSL request (https://gist.github.com/abachman/851492)
		RequestHeader set X_FORWARDED_PROTO 'https'
	</Location>
  <Location /rails>
          Require all granted
          ProxyPass http://127.0.0.1:12233/rails
          ProxyPassReverse http://127.0.0.1:12233/rails
          ProxyPassReverseCookieDomain 127.0.0.1 certbot.pdekritis.gr
          ProxyPreserveHost on
          # make sure Rails knows it was an SSL request (https://gist.github.com/abachman/851492)
          RequestHeader set X_FORWARDED_PROTO 'https'
  </Location>

	<Location /self_generated_files>
		Require all granted
	</Location>
	<Location /assets>
		RewriteEngine on
		Require all granted
		RewriteRule /assets/(.*)$ /public/assets/$1 [L]
	</Location>
	<Location /public/assets>
		Require all granted
	</Location>


	SSLCertificateFile /etc/letsencrypt/live/certbot.pdekritis.gr/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/certbot.pdekritis.gr/privkey.pem
	SSLProxyEngine on
	Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
